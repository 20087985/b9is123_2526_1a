<!DOCTYPE html>
<html>
<head>
    <title>Programming Exercises</title>
    <script src="ex1.js"></script>
    <script src="ex2.js"></script>
    <script src="ex3.js"></script>
    <script src="ex4.js"></script>
    <script src="ex5.js"></script>
    <script src="ex6.js"></script>
</head>
<body>

    <h1>Exercise 1: Baggage Check</h1>
    <p>
        <label>Enter Weight (kg):</label>
        <input type="text" id="weight">
        <button onclick="check()">Check Baggage</button>
    </p>
    <p>
        <input type="text" id="removed" style='display:none;' placeholder="Amount to remove">
        <button id='remB' onclick="remove()" style='display:none;'>Remove Weight</button>
    </p>

    <hr>

    <h1>Exercise 2: Project Euler</h1>
    <p>
        <button onclick="euler1()">Standard Euler Q1 (3, 5, 1000)</button>
    </p>
    <p>
        <label>A:</label> <input type="text" id="a" size="5">
        <label>B:</label> <input type="text" id="b" size="5">
        <label>N:</label> <input type="text" id="n" size="5">
        <button onclick="eulerCustom()">Custom Euler Sum</button>
    </p>

    <hr>

    <h1>Exercise 3: Lists and Multiples</h1>
    <p>
        <label>A:</label> <input type="text" id="a1" size="5">
        <label>B:</label> <input type="text" id="b1" size="5">
        <label>List L (space separated):</label> <input type="text" id="l">
        <button onclick="eulerlist()">Sum List Multiples</button>
    </p>
    <p>
        <label>List A (Factors):</label> <input type="text" id="aList">
        <label>List L (Multiples):</label> <input type="text" id="mList">
        <br><br>
        <button onclick="euler2Lists()">Sum (List A length 2)</button>
        <button onclick="euler2Lists1()">Sum (Any length List A)</button>
    </p>

    <hr>

    <h1>Exercise 4 & 5: String Parsing & Errors</h1>
    <p>
        <label>Enter String (Format: factors : multiples):</label><br>
        <input type="text" id="eulerString" style="width: 300px;" placeholder="3 5 : 1 2 3 4 5">
    </p>
    <p>
        <button onclick="processEulerString(document.getElementById('eulerString').value)">Exercise 4: Process String</button>
        <button onclick="alert(processEulerCorrupt(document.getElementById('eulerString').value))">Exercise 5: Handle Errors</button>
    </p>

    <hr>

    <h1>Exercise 6: GitHub API</h1>
    <p>
        <label>GitHub Username:</label>
        <input type="text" id="ghUser" placeholder="e.g. octocat">
        <button onclick="getMostForkedRepo(document.getElementById('ghUser').value)">Find Most Forked Repo</button>
    </p>

</body>
</html>
